; Pool PHP-FPM de l'API : plusieurs requêtes traitées en parallèle
; (le serveur de développement « artisan serve » n'en traite qu'une à la fois).
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recycle régulièrement les processus (évite toute fuite de mémoire sur la durée)
pm.max_requests = 500

; Garde les variables d'environnement du conteneur (APP_KEY, DB_*, MAIL_*...)
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
