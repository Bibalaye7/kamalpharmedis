; Réglages PHP du site (développement et production)

; Taille des photos produits envoyées depuis l'administration (nginx accepte 20 Mo)
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 60

; Aucune information technique exposée aux visiteurs
expose_php = Off
display_errors = Off
log_errors = On

; OPcache : le code PHP est compilé une seule fois. Le code étant figé dans l'image
; Docker (aucun montage de dossier), inutile de vérifier les fichiers à chaque requête.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
