name: kamalpharmedis

services:
  # --- Base de données (PostgreSQL) -----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: kpm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kamalpharmedis}
      POSTGRES_USER: ${DB_USERNAME:-kamalpharmedis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kamalpharmedis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kpm_network

  # --- Cache / sessions ------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kpm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kpm_network

  # --- Administration de la base (Adminer, compatible PostgreSQL) --------------
  adminer:
    image: adminer:4
    container_name: kpm_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kpm_network

  # --- API Laravel -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kpm_backend
    restart: unless-stopped
    environment:
      APP_NAME: KamalPharMédis
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL:-/storage}
      APP_KEY: ${APP_KEY}
      APP_LOCALE: fr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-kamalpharmedis}
      DB_USERNAME: ${DB_USERNAME:-kamalpharmedis}
      DB_PASSWORD: ${DB_PASSWORD:-kamalpharmedis}
      CACHE_STORE: redis
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: 60
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://127.0.0.1:3000"
      FRONTEND_URL: http://localhost
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAILTRAP_API_KEY: ${MAILTRAP_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@demomailtrap.co}
      MAIL_FROM_NAME: KamalPharMédis
      PAYDUNYA_MASTER_KEY: ${PAYDUNYA_MASTER_KEY:-}
      PAYDUNYA_PRIVATE_KEY: ${PAYDUNYA_PRIVATE_KEY:-}
      PAYDUNYA_PUBLIC_KEY: ${PAYDUNYA_PUBLIC_KEY:-}
      PAYDUNYA_TOKEN: ${PAYDUNYA_TOKEN:-}
      PAYDUNYA_MODE: ${PAYDUNYA_MODE:-test}
      MANUAL_PAYMENT_WAVE: ${MANUAL_PAYMENT_WAVE:-+221 70 464 12 81}
      MANUAL_PAYMENT_ORANGE_MONEY: ${MANUAL_PAYMENT_ORANGE_MONEY:-+221 75 661 62 62}
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kpm_network

  # --- Frontend Next.js --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: kpm_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      INTERNAL_API_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kpm_network

  # --- Reverse proxy -------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: kpm_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - kpm_network

networks:
  kpm_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_storage:
