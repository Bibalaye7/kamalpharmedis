name: kamalpharmedis

services:
  # --- Base de données -----------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: kpm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kamalpharmedis}
      MYSQL_USER: ${MYSQL_USER:-kamalpharmedis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kamalpharmedis}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kpm_network

  # --- Cache / sessions ------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kpm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kpm_network

  # --- Administration MySQL --------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: kpm_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kpm_network

  # --- API Laravel -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kpm_backend
    restart: unless-stopped
    environment:
      APP_NAME: KamalPharMédis
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY}
      APP_LOCALE: fr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-kamalpharmedis}
      DB_USERNAME: ${MYSQL_USER:-kamalpharmedis}
      DB_PASSWORD: ${MYSQL_PASSWORD:-kamalpharmedis}
      CACHE_STORE: redis
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: 60
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://127.0.0.1:3000"
      FRONTEND_URL: http://localhost
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAILTRAP_API_KEY: ${MAILTRAP_API_KEY:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@demomailtrap.co}
      MAIL_FROM_NAME: KamalPharMédis
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kpm_network

  # --- Frontend Next.js --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: kpm_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      INTERNAL_API_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kpm_network

  # --- Reverse proxy -------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: kpm_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - kpm_network

networks:
  kpm_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_storage:
