# Pages du site : Next.js (conteneur frontend, port 3000), mises en cache 10 s (voir cache.conf)
location / {
    proxy_pass http://frontend_upstream;

    proxy_cache pages;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 10s;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    # Next.js lent ou en panne : la dernière version de la page reste servie
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    # Next.js marque ses pages « no-store » ; le cache court de nginx reste sûr (pages identiques pour tous)
    proxy_ignore_headers Cache-Control Expires;
    # Navigation interne de Next.js (en-tête RSC) et pages privées : toujours servies en direct
    proxy_cache_bypass $http_rsc $kpm_page_privee $http_authorization;
    proxy_no_cache $http_rsc $kpm_page_privee $http_authorization;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
