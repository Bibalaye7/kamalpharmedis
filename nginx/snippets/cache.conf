# Mise en cache des pages du site par nginx (10 secondes) : la page d'accueil, le catalogue et les
# fiches produits sont identiques pour tous les visiteurs (la connexion du client est gérée dans le
# navigateur), donc 200 visiteurs dans la même seconde ne coûtent qu'un seul rendu à Next.js.
proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:10m max_size=200m inactive=10m use_temp_path=off;

# Jamais en cache : espaces privés, panier, liens personnels (réinitialisation, confirmation d'email)
map $request_uri $kpm_page_privee {
    default 0;
    ~^/(admin|compte|panier|reinitialiser-mot-de-passe|verifier-email) 1;
}
