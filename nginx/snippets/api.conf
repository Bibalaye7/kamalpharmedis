# API Laravel : PHP-FPM (conteneur backend, port 9000) en FastCGI.
# Toutes les adresses /api/* passent par public/index.php (routeur Laravel).
location /api/ {
    fastcgi_pass backend_fpm;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_read_timeout 60s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# Photos produits : servies directement par nginx depuis le volume du backend (lecture seule)
location /storage/ {
    alias /var/www/storage/;
    expires 30d;
    access_log off;
    try_files $uri =404;
}
