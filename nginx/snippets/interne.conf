# Accès interne à l'API pour Next.js (pages générées côté serveur), sur le réseau Docker
# uniquement : ce port n'est jamais publié. En production, il évite la redirection HTTPS.
server {
    listen 8000;
    server_name _;
    client_max_body_size 20M;
    include /etc/nginx/snippets/securite.conf;
    include /etc/nginx/snippets/api.conf;
}
