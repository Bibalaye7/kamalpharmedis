# Reverse proxy KamalPharMédis (développement, http://localhost)
# - /api/*      -> API Laravel (PHP-FPM)
# - /storage/*  -> photos produits (servies par nginx)
# - /*          -> frontend Next.js
# La production utilise nginx/production.conf.template (HTTPS).

include /etc/nginx/snippets/upstreams.conf;

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    include /etc/nginx/snippets/securite.conf;
    include /etc/nginx/snippets/api.conf;
    include /etc/nginx/snippets/frontend.conf;
}

include /etc/nginx/snippets/interne.conf;
